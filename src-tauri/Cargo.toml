[package]
name = "agentlings"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hub-core = { path = "../crates/hub-core" }
tauri = { version = "2", features = ["custom-protocol", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
